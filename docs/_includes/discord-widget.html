{% comment %}
  The SpellBot Discord server widget. Shared between the Getting Started and
  Community pages so the server id and sandbox flags live in one place.
{% endcomment %}

<div class="support">
  <iframe
    src="https://discord.com/widget?id=949425995969093722&theme=dark"
    width="350"
    height="500"
    title="SpellBot Discord server"
    allowtransparency="true"
    frameborder="0"
    sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
  ></iframe>
</div>
